# Workspace-level tool configuration. Each package has its own pyproject.toml
# for packaging; this file only configures linting, typing and tests.

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["packages/contracts", "packages/simcore", "packages/scoring", "apps/api", "tests"]
extend-exclude = ["apps/web", "apps/simulator", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF", "C4", "PIE", "PT"]
ignore = [
  "S101",   # assert is used in tests
  "RUF012", # mutable class attrs are fine for SQLAlchemy declarative models
  "B008",   # FastAPI dependency injection uses calls in defaults
  "PT018",  # compact composite assertions are clearer in these tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "S608", "PT011"]
"database/migrations/**" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["drikr_contracts", "drikr_simcore", "drikr_scoring", "drikr_api"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = ["packages/contracts", "packages/simcore", "packages/scoring", "apps/api"]
explicit_package_bases = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["reportlab.*", "argon2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
addopts = "-ra --strict-markers"
markers = [
  "integration: requires PostgreSQL (TEST_DATABASE_URL)",
  "slow: long-running reproducibility or performance checks",
]
filterwarnings = [
  "error::DeprecationWarning:drikr_.*",
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
  "ignore:ast.NameConstant is deprecated:DeprecationWarning",
]
