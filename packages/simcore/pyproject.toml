[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drikr-simcore"
version = "1.0.0"
description = "Drikr Systems training simulator: deterministic logical simulation core"
requires-python = ">=3.12"
dependencies = ["drikr-contracts==1.0.0"]

[tool.setuptools.packages.find]
include = ["drikr_simcore*"]

[tool.setuptools.package-data]
drikr_simcore = ["demo_scenarios/*.json"]
