name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22.23.3"
  TEST_DATABASE_URL: postgresql+psycopg://drikr:drikr_ci_only@127.0.0.1:5432/drikr_test

jobs:
  python:
    name: Python (lint, types, unit and integration tests)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.2-alpine3.20
        env:
          POSTGRES_USER: drikr
          POSTGRES_PASSWORD: drikr_ci_only
          POSTGRES_DB: drikr_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U drikr" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/contracts -e packages/simcore -e packages/scoring -e "apps/api[dev]"
      - name: Ruff lint
        run: ruff check packages apps/api tests database research
      - name: Ruff format check
        run: ruff format --check packages apps/api tests database research
      - name: Mypy (strict)
        run: mypy packages/contracts/drikr_contracts packages/simcore/drikr_simcore packages/scoring/drikr_scoring apps/api/drikr_api
      - name: Migrations apply, roll back and match models
        env:
          DRIKR_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        working-directory: apps/api
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check
      - name: Tests
        run: pytest --cov=drikr_contracts --cov=drikr_simcore --cov=drikr_scoring --cov=drikr_api --cov-report=term-missing
      - name: Dependency vulnerability audit
        run: pip-audit --skip-editable

  web:
    name: Web (lint, types, tests, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dependency vulnerability audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: End-to-end (Playwright)
    needs: [python, web]
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.2-alpine3.20
        env:
          POSTGRES_USER: drikr
          POSTGRES_PASSWORD: drikr_ci_only
          POSTGRES_DB: drikr
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U drikr" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DRIKR_ENVIRONMENT: test
      DRIKR_DATABASE_URL: postgresql+psycopg://drikr:drikr_ci_only@127.0.0.1:5432/drikr
      DRIKR_SECRET_KEY: ci-only-secret-key-that-is-long-enough-0123456789
      DRIKR_COOKIE_SECURE: "false"
      DRIKR_LOGIN_RATE_LIMIT_PER_MINUTE: "200"
      DRIKR_DEMO_PASSWORD: Training-Pass-2026!
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Start API
        run: |
          pip install -e packages/contracts -e packages/simcore -e packages/scoring -e apps/api
          drikr-api migrate
          drikr-api seed-demo --with-demo-users
          nohup uvicorn --factory drikr_api.main:app_factory --host 127.0.0.1 --port 8000 > api.log 2>&1 &
      - name: Build and serve web
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npm run build
          nohup npx vite preview --host 127.0.0.1 --port 4173 > ../../web.log 2>&1 &
      - name: Run Playwright
        working-directory: tests/e2e
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: e2e-artifacts
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
            api.log
            web.log

  containers:
    name: Container build and scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker build -f apps/api/Dockerfile -t drikr-api:ci .
      - run: docker build -f apps/web/Dockerfile -t drikr-web:ci .
      - name: Scan API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (pinned by commit)
        with:
          image-ref: drikr-api:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (pinned by commit)
        with:
          image-ref: drikr-web:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
